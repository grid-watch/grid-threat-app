name: Daily threat check

on:
  schedule:
    # 20:10 UTC = about 7:10am Sydney (summer); 08:10 UTC = about 7:10pm Sydney
    - cron: "10 20 * * *"
    - cron: "10 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run rule-based check
        run: python scripts/update.py
      - name: Save results
        run: |
          git config user.name "grid-threat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
